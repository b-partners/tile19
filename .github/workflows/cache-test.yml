name: Test Incident Cache

on:
  workflow_dispatch:

jobs:
  test-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cache
        id: restore_cache
        uses: actions/cache@v4
        with:
          path: incident_id.txt
          key: test-incident-id-cache
          restore-keys: |
            test-incident-id-cache

      - name: Check for cached file
        run: |
          if [ -f incident_id.txt ]; then
            echo "✅ File incident_id.txt found!"
            cat incident_id.txt
          else
            echo "❌ No cache found. Creating file..."
            echo "dummy-incident-id-$(date +%s)" > incident_id.txt
          fi

      - name: Save file to cache
        if: steps.restore_cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: incident_id.txt
          key: test-incident-id-cache
