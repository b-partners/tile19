name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

  workflow_call:



jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_REGION: eu-west-3
      AIRBUS_AUTHENTICATION_BASEURL: ${{
              (github.event_name == 'pull_request' && github.base_ref == 'prod') && secrets.PROD_AIRBUS_AUTHENTICATION_BASEURL ||
              (github.event_name == 'pull_request' && github.base_ref == 'preprod') && secrets.PREPROD_AIRBUS_AUTHENTICATION_BASEURL ||
              (github.ref == 'refs/heads/prod') && secrets.PROD_AIRBUS_AUTHENTICATION_BASEURL ||
              (github.ref == 'refs/heads/preprod') && secrets.PREPROD_AIRBUS_AUTHENTICATION_BASEURL
              }}
      AIRBUS_API_KEY: ${{
              (github.event_name == 'pull_request' && github.base_ref == 'prod') && secrets.PROD_AIRBUS_API_KEY ||
              (github.event_name == 'pull_request' && github.base_ref == 'preprod') && secrets.PREPROD_AIRBUS_API_KEY ||
              (github.ref == 'refs/heads/prod') && secrets.PROD_AIRBUS_API_KEY ||
              (github.ref == 'refs/heads/preprod') && secrets.PREPROD_AIRBUS_API_KEY
              }}
      AIRBUS_SEARCHAPI_BASEURL: ${{
              (github.event_name == 'pull_request' && github.base_ref == 'prod') && secrets.PROD_AIRBUS_SEARCHAPI_BASEURL ||
              (github.event_name == 'pull_request' && github.base_ref == 'preprod') && secrets.PREPROD_AIRBUS_SEARCHAPI_BASEURL ||
              (github.ref == 'refs/heads/prod') && secrets.PROD_AIRBUS_SEARCHAPI_BASEURL ||
              (github.ref == 'refs/heads/preprod') && secrets.PREPROD_AIRBUS_SEARCHAPI_BASEURL
              }}
      IMAGE_VALIDATOR_API_URL: ${{
              (github.event_name == 'pull_request' && github.base_ref == 'prod') && secrets.PROD_IMAGE_VALIDATOR_API_URL ||
              (github.event_name == 'pull_request' && github.base_ref == 'preprod') && secrets.PREPROD_IMAGE_VALIDATOR_API_URL ||
              (github.ref == 'refs/heads/prod') && secrets.PROD_IMAGE_VALIDATOR_API_URL ||
              (github.ref == 'refs/heads/preprod') && secrets.PREPROD_IMAGE_VALIDATOR_API_URL
              }}


    steps:
      - uses: actions/checkout@v4.1.6

      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'
      - run: chmod +x gradlew
      - run: chmod +x .shell/publish_gen_to_maven_local.sh
      - run: |
          ./gradlew test \
            -Dairbus.authentication.baseurl="$AIRBUS_AUTHENTICATION_BASEURL" \
            -Dairbus.api.key="$AIRBUS_API_KEY" \
            -Dairbus.searchapi.baseurl="$AIRBUS_SEARCHAPI_BASEURL" \
            -Dimage.validator.api.url="$IMAGE_VALIDATOR_API_URL"

      

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.1.6
      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - run: chmod +x format.sh
      - run: ./format.sh && git diff --exit-code