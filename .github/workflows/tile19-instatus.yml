name: Tile19-instatus

on:
  workflow_dispatch:
  schedule:
    - 'cron': '0 * * * *'

env:
  API_KEY: ${{ secrets.INSTATUS_API_KEY }}
  INSTATUS_PAGE_ID: ${{ secrets.INSTATUS_PAGE_ID }}
  INSTATUS_UNAVAILABLE_IMAGE_TEMPLATE_ID: ${{ secrets.INSTATUS_UNAVAILABLE_IMAGE_TEMPLATE_ID }}
  INSTATUS_AVAILABLE_IMAGE_TEMPLATE_ID: ${{ secrets.INSTATUS_AVAILABLE_IMAGE_TEMPLATE_ID }}

jobs:
  monitor-tile19-status:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore incident_id cache
        id: restore_cache
        uses: actions/cache@v4
        with:
          path: incident_id.txt
          key: incident-id-cache-${{ github.run_id }}
          restore-keys: |
            incident-id-cache-

      - name: Read cached incident ID
        run: |
          if [ -f incident_id.txt ]; then
            incident_id=$(cat incident_id.txt)
            echo "incident_id=$incident_id" >> $GITHUB_ENV
            echo "Restored incident_id from cache: '$incident_id'"
            echo "resolve_incident=true" >> $GITHUB_ENV
          else
            echo "resolve_incident=false" >> $GITHUB_ENV
            echo "No incident_id.txt found in cache."
          fi

      - name: Launch tile19 test
        run: |
          echo "Checking image availability on tile19..."
          test_status="OK"
          failure_count=0
          
          while read -r request_body; do
            echo "Request body: $request_body"
          
            response=$(curl -s -w "\n%{http_code}" -X POST "https://ifdovpj3xe.execute-api.eu-west-3.amazonaws.com/extend" \
              -H "Content-Type: application/json" \
              --data "$request_body")
          
            body=$(echo "$response" | sed '$d')
            http_code=$(echo "$response" | tail -n1)
          
            echo "Code HTTP : $http_code"
          
            if [ "$http_code" -ne 200 ]; then
              echo "Request failed with body:"
              echo "$request_body"
              failure_count=$((failure_count + 1))
              echo "Current failure count: $failure_count"
          
              if [ "$failure_count" -ge 30 ]; then
                echo "Failure count reached 30. Marking test_status as KO."
                test_status="KO"
                break
              fi
            fi
          
            echo "-------------------------------------------"
          done < <(jq -c '.[]' .github/workflows/tile19-request-body.json)
          
          echo "test_status=$test_status" >> $GITHUB_ENV
          echo "failure_count : $failure_count"
          echo "Global test status : $test_status" 

      - name: Monitor tile19 availability
        if: ${{ env.test_status == 'KO' }}
        run: |
          echo "Image retrieval failed, creating incident on Instatus..."

          cached_incident_id="${incident_id}"
          
          if [ -n "$cached_incident_id" ] && [ "$cached_incident_id" != "null" ]; then
            echo "Cached incident id=${cached_incident_id}"
            response=$(curl -s -X GET "https://api.instatus.com/v1/${INSTATUS_PAGE_ID}/incidents/${cached_incident_id}" \
              -H "Authorization: Bearer $API_KEY")

            status=$(echo "$response" | jq -r '.status')
            echo "Current incident status: $status"

            if [ "$status" = "INVESTIGATING" ]; then
              echo "Incident $cached_incident_id is still in INVESTIGATING state. Skipping creation."
            else
              instatus_response=$(curl -s -X POST "https://api.instatus.com/v1/${INSTATUS_PAGE_ID}/incidents/${INSTATUS_UNAVAILABLE_IMAGE_TEMPLATE_ID}" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $API_KEY" \
                -d '{}')

              echo "instatus_response: $instatus_response"
              new_incident_id=$(echo "$instatus_response" | jq -r '.id')
              echo "$new_incident_id" > incident_id.txt
              echo "incident_id=$new_incident_id" >> $GITHUB_ENV
              echo "should_cache=true" >> $GITHUB_ENV
              echo "resolve_incident=false" >> $GITHUB_ENV
            fi
          else
            instatus_response=$(curl -s -X POST "https://api.instatus.com/v1/${INSTATUS_PAGE_ID}/incidents/${INSTATUS_UNAVAILABLE_IMAGE_TEMPLATE_ID}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $API_KEY" \
              -d '{}')

            echo "instatus_response: $instatus_response"
            new_incident_id=$(echo "$instatus_response" | jq -r '.id')
            echo "$new_incident_id" > incident_id.txt
            echo "incident_id=$new_incident_id" >> $GITHUB_ENV
            echo "should_cache=true" >> $GITHUB_ENV
            echo "resolve_incident=false" >> $GITHUB_ENV
          fi

      - name: Save incident_id.txt to cache
        if: ${{ env.should_cache == 'true' }}
        uses: actions/cache@v4
        with:
          path: incident_id.txt
          key: incident-id-cache-${{ github.run_id }}

      - name: Send resolved incident to Instatus
        if: ${{ env.resolve_incident == 'true' && env.test_status == 'OK'}}
        run: |
          if [ -f incident_id.txt ]; then
            incident_id=$(cat incident_id.txt)
            echo "Checking status of incident_id: $incident_id on Instatus..."

            response=$(curl -s -X GET "https://api.instatus.com/v1/${INSTATUS_PAGE_ID}/incidents/${incident_id}" \
              -H "Authorization: Bearer $API_KEY")

            status=$(echo "$response" | jq -r '.status')

            echo "Current incident status: $status"

            if [ "$status" != "RESOLVED" ]; then
              echo "Updating and resolving incident_id: $incident_id on Instatus..."

              curl -s -X POST "https://api.instatus.com/v2/${INSTATUS_PAGE_ID}/incidents/${incident_id}/incident-updates/${INSTATUS_AVAILABLE_IMAGE_TEMPLATE_ID}" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $API_KEY" \
                -d '{}'
            else
              echo "Incident already resolved. Skipping update."
            fi
          
          fi